name: Windows tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Check command help
        run: |
          python -X utf8 scripts/launch_preflight.py --help
          python -X utf8 scripts/desktop_cleanup.py --help
          python -X utf8 scripts/layout_inventory.py --help
