name: Backend source build and offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-source-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline fixture tests
        run: python -B -X utf8 backend/run_tests.py
      - name: Compile source only, without installation or app launch
        run: python -B -X utf8 backend/build.py --output "$env:RUNNER_TEMP/claude-guard-source-build"
